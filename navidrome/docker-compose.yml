services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_MUSICFOLDER: /music
      ND_PORT: 4533
      ND_LASTFM_APIKEY: ${lastfm_shared_secret}
      ND_LASTFM_SECRET: ${lastfm_api}
      ND_LASTFM_ENABLED: "true"
    volumes:
      - ./data:/data
      - ${music_folder_library}:/music:ro
    networks:
      - music_server

networks:
    music_server:
      external: true
